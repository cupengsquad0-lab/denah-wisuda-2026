$('dl').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='denah-kursi-'+cur+'.png';a.click()});
$('zo').onclick=()=>{fit=!fit;cv.style.width=fit?'100%':dims[0]+'px';cv.style.height=fit?'auto':dims[1]+'px';$('zo').textContent=fit?'🔍 Ukuran asli':'🔍 Muat ke layar'};
